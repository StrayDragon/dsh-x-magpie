name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (strict)
        run: bun run typecheck

      - name: Build into dist/
        run: bun run build

      - name: Built output is valid ESM
        run: bun build --no-bundle dist/index.js --outdir /tmp/verify && node --check dist/client.js

      - name: Behavioral smoke (host half against a mock gateway)
        run: bun run test:smoke

      - name: dist/ carries the shippable tree
        run: |
          test -f dist/index.js
          test -f dist/client.js
          test -f dist/types/index.d.ts
