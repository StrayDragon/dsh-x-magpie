name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (strict)
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Built output is valid ESM
        run: bun build --no-bundle index.js --outdir /tmp/verify && node --check client.js

      - name: Behavioral smoke (host half against a mock gateway)
        run: bun run test:smoke

      - name: No uncommitted build artifacts
        run: git diff --exit-code -- index.js client.js
